<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen">

<!-- LOGIN SCREEN -->
<div id="loginBox" class="flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-6 text-slate-700">
      Teacher Login
    </h1>

    <input id="username"
      class="w-full border rounded-lg p-3 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
      placeholder="Username" />

    <input id="password" type="password"
      class="w-full border rounded-lg p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400"
      placeholder="Password" />

    <button onclick="login()"
      class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
      Login
    </button>

    <p id="loginError" class="text-red-500 text-sm text-center mt-3"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden p-6 max-w-6xl mx-auto">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-slate-700">
      Attendance Dashboard
    </h2>
    <button onclick="logout()"
      class="text-sm bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
      Logout
    </button>
  </div>

  <!-- CONTROLS -->
  <div class="bg-white p-5 rounded-xl shadow mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
    <select id="dept" class="border rounded p-2">
      <option value="SCM">SCM</option>
      <option value="EXIM">EXIM</option>
    </select>

    <input id="duration" type="number"
      class="border rounded p-2"
      placeholder="Duration (minutes)" />

    <button onclick="startSession()"
      class="bg-green-600 text-white rounded p-2 hover:bg-green-700 transition">
      Start Attendance
    </button>

    <button onclick="generateQR()"
      class="bg-purple-600 text-white rounded p-2 hover:bg-purple-700 transition">
      Generate QR
    </button>
  </div>

  <!-- QR + DATE -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">

    <!-- QR BOX -->
    <div class="bg-white p-4 rounded-xl shadow text-center">
      <h3 class="font-semibold mb-3 text-slate-600">Attendance QR</h3>
      <div id="qrBox" class="flex justify-center items-center h-52 text-slate-400">
        QR not generated
      </div>
    </div>

    <!-- DATE & EXPORT -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h3 class="font-semibold mb-3 text-slate-600">Attendance Records</h3>

      <input id="date" type="date"
        class="border rounded p-2 w-full mb-3" />

      <div class="flex gap-2">
        <button onclick="loadHistory()"
          class="flex-1 bg-blue-600 text-white rounded p-2 hover:bg-blue-700 transition">
          View
        </button>

        <button onclick="exportExcel()"
          class="flex-1 bg-gray-700 text-white rounded p-2 hover:bg-gray-800 transition">
          Export Excel
        </button>
      </div>
    </div>
  </div>

  <!-- LOADER -->
  <div id="loader" class="hidden text-center my-4">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
  </div>

  <!-- TABLE -->
  <div class="bg-white rounded-xl shadow overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-200">
        <tr>
          <th class="p-3 text-left">Name</th>
          <th class="p-3 text-left">Roll No</th>
          <th class="p-3 text-left">Status</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>
  </div>

</div>

<script src="js/admin.js"></script>
</body>
</html>
