<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<!-- TOP BAR -->
<div class="bg-blue-600 text-white p-4 flex justify-between items-center">
  <button onclick="toggleMenu()" class="text-2xl">☰</button>
  <h1 class="font-semibold">Teacher Panel</h1>
  <button onclick="logout()" class="text-sm bg-red-500 px-3 py-1 rounded">Logout</button>
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow transform -translate-x-full transition">
  <button onclick="showDashboard()" class="block w-full text-left p-4 border-b">📊 Attendance</button>
  <button onclick="showStudents()" class="block w-full text-left p-4 border-b">👥 Students</button>
</div>

<!-- MAIN -->
<div class="p-6" id="main">

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="flex gap-2 mb-4">
      <select id="dept" class="border p-2">
        <option value="SCM">SCM</option>
        <option value="EXIM">EXIM</option>
      </select>

      <input id="duration" type="number" class="border p-2" placeholder="Minutes">

      <button id="startBtn" onclick="startSession()" class="bg-green-600 text-white px-4 py-2 rounded">
        Start
      </button>
    </div>

    <input id="date" type="date" class="border p-2 mb-2">
    <button id="viewBtn" onclick="loadHistory()" class="bg-blue-600 text-white px-4 py-2 rounded">
      View Attendance
    </button>

    <table class="mt-4 w-full bg-white">
      <tbody id="table"></tbody>
    </table>
  </div>

  <!-- STUDENTS -->
  <div id="students" class="hidden">
    <h2 class="font-semibold mb-2">Registered Students</h2>
    <div id="studentsList"></div>
  </div>

</div>

<script src="js/admin.js"></script>
</body>
</html>
